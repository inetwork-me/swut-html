<!-- Self-contained on purpose: GitHub Pages serves this file's content at the

<style>
  :root { --ink: #0a0a0a; --paper: #fff; --muted: rgba(255,255,255,0.65); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  header { display: flex; align-items: center; height: 80px; padding: 0 24px; }
  main { flex: 1; display: flex; align-items: center; padding: 48px 24px 72px; }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; }
  .tag {
    display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 9999px; padding: 6px 16px; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.7);
  }
  h1 { margin: 24px 0 0; font-size: clamp(2.25rem, 7vw, 3.75rem); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
  p { margin: 20px 0 0; max-width: 46ch; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.125rem); }
  .actions { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 50px; padding: 0 24px; font-size: 14px; font-weight: 600;
    border: 1px solid transparent; transition: background-color .2s, color .2s;
  }
  .btn-filled { background: var(--paper); color: #000; }
  .btn-filled:hover { background: #e5e5e5; }
  .btn-outline { border-color: var(--paper); color: var(--paper); }
  .btn-outline:hover { background: var(--paper); color: #000; }
  .btn:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
  nav.more { margin-top: 56px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 24px; }
  nav.more span { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  nav.more ul { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 28px; }
  nav.more a { color: rgba(255,255,255,0.7); font-size: 15px; }
  nav.more a:hover { color: var(--paper); }
</style>
</head>
<body>
  <header>
    <a href="/swut-html/" aria-label="SWUT Solutions — home">
